name: Aurora first-boot checks
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
defaults:
  run:
    shell: bash
jobs:
  source:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - run: |
          python3 -m unittest discover -s tests
          bash -n libexec/* dracut/97aurora-root/module-setup.sh mkinitcpio/aurora-root tests/loop-conversion tests/loop-rekey tests/selinux-labels tests/selinux-policy images/finalize-image images/label-fedora-rootfs
          python3 -m py_compile images/*.py
  console:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
      - name: Verify handoff from an existing console owner
        run: sudo python3 tests/console-handoff.py
  conversion:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - name: Convert the disposable fixture with the target Fedora toolchain
        run: |
          set -euo pipefail
          for small_image in 0 1; do
            docker run --rm --privileged --ipc=host -v /dev:/dev -v /run/udev:/run/udev:ro \
              -v "$PWD:/src" -w /src -e AURORA_TEST_SMALL_IMAGE="$small_image" \
              -e AURORA_TEST_INTERRUPT="$small_image" \
              registry.fedoraproject.org/fedora:44 \
              bash -euo pipefail -c '
                dnf install -y btrfs-progs cryptsetup dosfstools e2fsprogs util-linux systemd-udev findutils gawk
                cryptsetup --version
                timeout --kill-after=10s 5m unshare --mount --propagation private bash tests/loop-conversion
              '
          done 2>&1 | tee conversion.log
      - name: Rekey the disposable fixture with the owner's password
        run: |
          set -euo pipefail
          docker run --rm --privileged --ipc=host -v /dev:/dev -v /run/udev:/run/udev:ro \
            -v "$PWD:/src" -w /src registry.fedoraproject.org/fedora:44 \
            bash -euo pipefail -c '
              dnf install -y cryptsetup util-linux systemd-udev coreutils gawk python3
              timeout --kill-after=10s 5m bash tests/loop-rekey
            ' 2>&1 | tee -a conversion.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: firstboot-conversion-evidence
          path: conversion.log
  selinux-labels:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - name: Verify finalizer labels with real Fedora targeted policy
        run: |
          set -euo pipefail
          docker run --rm --privileged -v "$PWD:/src:ro" -w /src \
            registry.fedoraproject.org/fedora:44 bash -euo pipefail -c '
              dnf install -y policycoreutils selinux-policy-targeted selinux-policy-devel setools-console make
              bash tests/selinux-labels
              bash tests/selinux-policy
            ' 2>&1 | tee selinux-labels.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: firstboot-selinux-labels
          path: selinux-labels.log
