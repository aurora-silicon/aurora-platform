# Aurora secure boot path; see /usr/share/doc/aurora-secboot/README.md.
KEY_OWNER=aurora        # aurora (default) | owner | both
SECURE_PATH=no          # no: build/sign/report only | yes: the newest UKI is EFI/BOOT/BOOTAA64.EFI
LOCKDOWN=integrity      # integrity (default) | confidentiality
KEY_DIR=/var/lib/aurora/secboot/keys
ESP=                    # empty: the ESP named by /chosen/asahi,efi-system-partition, else /boot/efi
UKI_BUILD=auto          # auto: build a UKI per kernel when db.key exists | yes | no
STAGE2_SIGN=auto        # auto: sign each Stage 2 update with stage2.key when it exists (owner/both) | yes | no
STAGE2_SECVER=1         # security version in Stage 2 signatures; never below the Stage 1 floor
