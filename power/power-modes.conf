# aurora-power-modes settings. Every line here is commented out, so the
# defaults apply; see /usr/share/doc/aurora-power-budget/README.md.
# Changes take effect at the next start: systemctl restart aurora-power-modes

# macOS's Low Power Mode setting: switch to Power Saver
# never (default, as on macOS) | always | battery | adapter
#low_power_mode = never

# Turn a leg off (rt_floor, aspm, platform) ...
#aspm = off
# ... or change its value for one profile (power-saver, balanced, performance).
#rt_floor.power-saver = 0
#aspm.power-saver = powersupersave
