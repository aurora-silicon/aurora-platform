; GameMode defaults for Apple silicon, installed as /etc/gamemode.ini.
; GameMode merges this over its shipped defaults; a user's
; ~/.config/gamemode.ini still overrides it.

[general]
; Keep the energy-aware governor. GameMode's own default asks for
; "performance", which on Apple silicon holds every cluster at its top clock
; and turns energy-aware scheduling off. The game gains nothing from it.
desiredgov=schedutil
defaultgov=schedutil

[cpu]
; Run the game's threads on the biggest cores. GameMode finds them by
; cpuinfo_max_freq and skips pinning when fewer than four qualify, so Macs
; with two P cores (A18 Pro) keep the default placement.
park_cores=no
pin_cores=yes
