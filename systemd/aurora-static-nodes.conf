# kmod-static-nodes.service orders itself only before
# systemd-tmpfiles-setup-dev-early.service, and systemd-tmpfiles-setup-dev.service
# only after that unit. mkinitcpio's systemd hook does not install the early unit,
# so in the initramfs nothing orders the two: the /dev nodes listed in
# modules.devname (btrfs-control) can be created before the list exists. udev's
# btrfs builtin then reports the root "not ready" because /dev/btrfs-control is
# missing, nothing loads btrfs, and the boot waits for the root device forever.
[Unit]
After=kmod-static-nodes.service
