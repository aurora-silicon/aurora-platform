[Unit]
# Plasma Setup creates the owner account on KDE images once Aurora has
# protected the disk. It waits for that step and is skipped, never failed,
# while setup is pending and when Aurora's text wizard created the owner.
After=aurora-firstboot.service
ConditionPathExists=!/var/lib/aurora/firstboot/pending
ConditionPathExists=!/var/lib/aurora/firstboot/complete
