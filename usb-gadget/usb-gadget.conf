# USB device mode (aurora-usb-gadget, usb-gadget/README.md).
# Read each time a USB host is plugged in. To apply a change while one is
# plugged in: aurora-usb-gadget down && aurora-usb-gadget up

# Act as a USB device when a host is plugged into a port in device mode.
ENABLED=yes

# Functions offered to the host: ncm (network), acm (serial port).
FUNCTIONS="ncm acm"

# IPv4 on the USB network. IPv6 link-local is always on.
#   link-local  169.254.x.x on both sides, no setup (macOS does the same)
#   shared      this Mac gives the host an address by DHCP (10.42.0.0/24)
#               and shares its own network connection with it (NAT)
#   off         IPv6 link-local only
IPV4=link-local

# A login prompt on the serial port (/dev/ttyGS0). Off by default: a USB
# host should not get a login prompt unasked. To turn it on:
#   sudo aurora-usb-gadget console enable
CONSOLE=no

# Offer an image file to the host as a USB disk. Empty: no disk.
STORAGE_IMAGE=
# Read-only unless set to no. Never let the host write to an image that is
# mounted on this Mac at the same time.
STORAGE_READONLY=yes
# Present the image as a CD-ROM (for ISO images).
STORAGE_CDROM=no
